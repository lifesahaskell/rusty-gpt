[package]
name = "rusty-gpt"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
cuda = ["burn/cuda"]

[dependencies]
burn = { version = "0.21", features = ["train", "ndarray"] }
rand = "0.10.1"
anyhow = "1"

axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6.10", features = ["cors", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.11"
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }
clap = { version = "4.6.4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
nix = { version = "0.31.3", features = ["signal"] }
tower = { version = "0.5.3", features = ["util"] }
